# MSc reactive-baseline configuration.
# All runtime values use SI units: metres, seconds and radians.
# Supported choices are listed beside each selector so this file remains the
# single visible control surface.

# ---------------------------------------------------------------------------
# Runtime and reactive controller
# ---------------------------------------------------------------------------

[run]
nominal_dt_s = 0.002
# Arm choices: "right", "left", "both". A CLI arm argument overrides this.
arm = "right"

[controller.reactive_pose]
kp_position_s_inv = 32.00
kp_rotation_s_inv = 2.1
kd_position = 0.9
kd_rotation = 0.9
null_gain_s_inv = 2.0
dls_damping = 0.05
position_enabled = true
orientation_enabled = true
velocity_enabled = true
# Adds target.twist_world minus the mount-induced EE velocity (measured EE
# twist minus J*qdot) into the commanded task twist, undamped, so the arm
# cancels the mount's motion as it happens. Off = PD-on-error only (the
# hardware baseline). See tools/feedforward_compare.py and tests/test_feedforward.py.
velocity_feedforward_enabled = false

[limits]
joint_velocity_rad_s = [
  1.3892820845874863,
  1.3892820845874863,
  1.3892820845874863,
  1.3892820845874863,
  1.2199851471440364,
  1.2199851471440364,
  1.2199851471440364,
]
position_lead_rad = 0.2

# ---------------------------------------------------------------------------
# Safety and end-effector routing
# ---------------------------------------------------------------------------

# Whole-arm protection around the wearer. This finite cylinder is expressed in
# the TORSO frame and therefore moves with the person. Link radii and
# clearance_m are added by the safety filter; the fixed mount is exempt.
[human_safety]
enabled = true
center_xy_torso_m = [0.0, 0.0]
radius_m = 0.20
z_min_torso_m = -1.10
z_max_torso_m = 0.70
clearance_m = 0.01
control_margin_m = 0.02
activation_distance_m = 0.01
recovery_gain_s_inv = 4.0
approach_velocity_damping = 0.0
projection_iterations = 50
constraint_tolerance_m_s = 1e-6

# WORLD-frame end-effector keep-out around one vertical cylinder.
# This is not whole-arm/link collision avoidance. Routing happens at
# composition time, BEFORE timing: a static-target reach that would cross the
# cylinder becomes a timed waypoint trajectory around it (using the [planning]
# kinematic limits below), so desired position and velocity come from the same
# path. Configured trajectories and planned paths are not routed: their
# authors (or the planner) own their clearance.
[cylinder_keepout]
cylinder_keepout_enabled = true
cylinder_keepout_center_x_m = 0.0
cylinder_keepout_center_y_m = 0.0
cylinder_keepout_radius_m = 0.25
cylinder_keepout_z_min_m = 0.0
cylinder_keepout_z_max_m = 1.8
cylinder_keepout_clearance_m = 0.10
cylinder_waypoint_tolerance_m = 0.01

# Cartesian planner above the reactive controller. It plans from the measured
# end-effector pose to [targets.<arm>]. Collision costs are evaluated in the
# TORSO frame; the delivered reference remains WORLD-frame.
#
# Planning is a per-arm feasibility stage: with enabled=true it drives only
# the arm(s) named by `arm`; every other arm keeps its own configured
# static target or trajectory. An arm cannot be both planned and given a
# [targets.<arm>.trajectory]. The kinematic limits below also time
# keep-out routed reaches for unplanned arms.
[planning]
enabled = false
arm = "right"
waypoint_count = 3
dense_samples = 60
clearance_margin_m = 0.05
smoothness_weight = 10.0
obstacle_weight = 40.0
max_iterations = 200
tool_radius_m = 0.05
# Weak pull toward the straight line: without it the obstacle hinge has
# no finite basin and can route the path outside the arm's workspace.
deviation_weight = 0.5
# Hard bound on each knot: the start/goal box grown by this allowance.
reach_allowance_m = 0.45
lead_compensation_enabled = true
replan_clearance_trigger_m = 0.01
include_floor = true
floor_height_world_m = 0.0
include_torso_box = true
torso_box_half_extent_m = [0.12, 0.18, 0.28]
max_linear_speed_m_s = 3.0
max_linear_acceleration_m_s2 = 1.0
max_angular_speed_rad_s = 2.0
max_angular_acceleration_rad_s2 = 1.5

# ---------------------------------------------------------------------------
# Targets and motion plans
# ---------------------------------------------------------------------------

# [targets.<arm>] is the static fallback and the planner goal.
# An optional [targets.<arm>.trajectory] replaces that arm's static target.
[targets.right]
reference_frame = "world"
# Active right-arm planner goal.
position_m = [0.40, -0.30, 1.30]
rpy_rad = [1.5708, 0.0, 1.5708]

[targets.left]
reference_frame = "world"
position_m = [0.40, 0.30, 1.30]
# Mirror of the right-arm goal orientation across the torso xz-plane, so the
# left tool faces the wearer the same way the right one does.
rpy_rad = [1.5708, 0.0, 1.5708]

# LEFT POSITION TRAJECTORY
#
# start: "measured" holds the launch pose; "configured_target" starts from the
# [targets.left] pose. loop=true requires continuous pose, twist and
# acceleration at the end-to-start boundary.
#
# Supported segment types and their defining fields:
#   hold      duration_s
#   line      displacement_m or end_position_m; optional duration_s/end_rpy_rad
#   waypoints offsets_m or positions_m; optional durations_s/rpy_rad
#   circle    radius_m, revolutions, clockwise, and either plane or
#             normal+start_direction; optional duration_s/end_rpy_rad
#
# Optional [targets.left.trajectory.constraints] fields:
#   max_linear_speed_m_s, max_linear_acceleration_m_s2,
#   max_angular_speed_rad_s, max_angular_acceleration_rad_s2
# LEFT ORIENTATION POLICY — optional; no table keeps the start/segment
# orientation for the whole trajectory (the current behaviour).
#
# Supported policies:
#   no orientation table             keep the start/segment orientation
#   "look_at_sim_object"             face a named moving MuJoCo body
#   "look_at_fixed_world_point"      face a fixed WORLD point
#
# Look-at replaces segment RPY and cannot be combined with end_rpy_rad/rpy_rad.
# The tool axes are local left_pinch_site axes. The forward axis faces the
# object; tool-up and world-up resolve roll. To re-enable, uncomment:
# [targets.left.trajectory.orientation]
# policy = "look_at_sim_object"
# object_body = "look_at_object"
# tool_forward_axis = [0.0, 0.0, 1.0]
# tool_up_axis = [0.0, 1.0, 0.0]
# world_up_direction = [0.0, 0.0, 1.0]
#
# Or the fixed-point policy: replace the two fields above with:
# policy = "look_at_fixed_world_point"
# object_position_world_m = [0.30, 0.00, 1.10]

# ---------------------------------------------------------------------------
# Simulation-only inputs
# ---------------------------------------------------------------------------

[simulation.initial_joint_position_rad]
# Initial joint posture for the arm with the configured trajectory.
left = [
  0.22356,
  0.73366,
  -0.39854,
  1.71674,
  -0.53462,
  0.91219,
  0.62194,
]

# Required by policy = "look_at_sim_object". This drives the independent,
# non-contact blue mocap object in WORLD coordinates:
# p(t) = home + linear_amplitude_m * sin(2*pi*frequency*t), all WORLD metres.
[simulation.look_at_object_motion]
body_name = "look_at_object"
home_position_world_m = [0.30, 0.00, 1.10]
linear_amplitude_m = [0.00, 0.10, 0.00]
linear_frequency_hz = 0.10
