[run]
nominal_dt_s = 0.002
arm = "both"

[controller.reactive_pose]
kp_position_s_inv = 2.0
kp_rotation_s_inv = 2.0
kd_position = 0.3
kd_rotation = 0.3
null_gain_s_inv = 1.0
dls_damping = 0.05
position_enabled = true
orientation_enabled = true
velocity_enabled = true

[limits]
joint_velocity_rad_s = [
  1.3892820845874863,
  1.3892820845874863,
  1.3892820845874863,
  1.3892820845874863,
  1.2199851471440364,
  1.2199851471440364,
  1.2199851471440364,
]
position_lead_rad = 0.2

# Real-time whole-arm protection around the wearer. Geometry is expressed in
# the TORSO frame, so the envelope translates and rotates with the person.
# The radius and height describe the occupied human volume; each arm's
# mesh-derived sphere radius and clearance_m are added by the safety filter.
# The fixed shoulder/mount interface is modelled but explicitly exempt.
[human_safety]
enabled = true
center_xy_torso_m = [0.0, 0.0]
radius_m = 0.25
z_min_torso_m = -1.10
z_max_torso_m = 0.70
clearance_m = 0.02
control_margin_m = 0.02
activation_distance_m = 0.10
recovery_gain_s_inv = 4.0
approach_velocity_damping = 0.0
projection_iterations = 50
constraint_tolerance_m_s = 1e-6

# One world-frame vertical cylinder around the human/occupied area. The scene's
# torso/person is centred at world x=0, y=0 between the two arm mounts, so the
# configured centre below is that shared central axis. Both arms route around
# this SAME cylinder; it is never rotated by either tilted arm-base frame.
# Direct paths that cross the inflated cylinder take the shortest clockwise,
# counter-clockwise or over-the-top waypoint route. Targets inside are moved
# just outside; they are not refused. Metres, in WORLD coordinates.
#
# END-EFFECTOR routing only — NOT whole-arm/link collision avoidance.
[cylinder_keepout]
cylinder_keepout_enabled = true
cylinder_keepout_center_x_m = 0.0
cylinder_keepout_center_y_m = 0.0
cylinder_keepout_radius_m = 0.25
cylinder_keepout_z_min_m = 0.0
cylinder_keepout_z_max_m = 1.8
cylinder_keepout_clearance_m = 0.10
cylinder_waypoint_tolerance_m = 0.01

# Collision-aware Cartesian path planning above the reactive controller.
# The planner has NO goal of its own: it plans from the measured end-effector
# pose to the existing [targets.<arm>] pose, keeping goal representation in
# one place. Collision is optimised in the TORSO frame, where the wearer
# envelope above is static by construction; the delivered reference stays
# WORLD-frame, because the task is a world-frame pose hold.
#
# Mutually exclusive with [cylinder_keepout]: that router replaces the
# reference POSITION while passing the planner's TWIST through unchanged, so
# the P and D terms would reference different points. Enabling both raises.
#
# lead_compensation_enabled pre-inverts the controller's known steady-state
# lag (v/Kp, the exact inverse) at the reference, so the planned path is what
# the arm actually executes. It modifies no controller file. Turn it OFF to
# measure the uncompensated reactive baseline.
[planning]
enabled = true
arm = "right"
waypoint_count = 3
dense_samples = 60
clearance_margin_m = 0.05
smoothness_weight = 1.0
obstacle_weight = 40.0
max_iterations = 200
tool_radius_m = 0.0
# Weak pull toward the straight line: without it the obstacle hinge has
# no finite basin and can route the path outside the arm's workspace.
deviation_weight = 0.5
# Hard bound on each knot: the start/goal box grown by this allowance.
reach_allowance_m = 0.45
lead_compensation_enabled = true
replan_clearance_trigger_m = 0.01
include_floor = true
floor_height_world_m = 0.0
include_torso_box = true
torso_box_half_extent_m = [0.12, 0.18, 0.28]
max_linear_speed_m_s = 0.2
max_linear_acceleration_m_s2 = 0.5
max_angular_speed_rad_s = 0.5
max_angular_acceleration_rad_s2 = 1.0

[targets.right]
reference_frame = "world"
# Planning demo goal: the straight line from the start pose penetrates the
# wearer envelope by 175 mm, so the planner has real work to do and routes
# around it to the configured 50 mm margin. main.py disables the keep-out
# router for planned runs. Previous static-hold goal: [0.45, -0.20, 1.20].
position_m = [0.20, 0.40, 1.10]
rpy_rad = [0.0, 1.6, 0.8]

[targets.left]
reference_frame = "world"
position_m = [0.45, 0.30, 1.20]
rpy_rad = [0.0, 0.0, 0.0]

[targets.left.trajectory]
reference_frame = "world"
start = "measured"
loop = true
open_live_path_plot = true

# Optional trajectory-level orientation policy. This is independent of the
# position segments below. The moving-object form samples the named MuJoCo
# mocap body's WORLD position once per visible control cycle.
# When enabled, it replaces the configured/static RPY along this trajectory.
# Uncomment the complete block to enable it. The tool axes are local
# left_pinch_site axes: tool_forward_axis is the grasping axis that points at
# the object. Roll is fixed by aligning the projected tool_up_axis with the
# projected world_up_direction. Verify the local axes for the mounted gripper.
# Look-at requires reference_frame = "world"; do not also use per-segment
# end_rpy_rad or rpy_rad.
#
# [targets.left.trajectory.orientation]
# policy = "look_at_sim_object"
# object_body = "look_at_object"
# tool_forward_axis = [0.0, 0.0, 1.0]
# tool_up_axis = [0.0, 1.0, 0.0]
# world_up_direction = [0.0, 0.0, 1.0]
#
# Fixed-point alternative: replace policy/object_body above with:
# policy = "look_at_fixed_world_point"
# object_position_world_m = [0.30, 0.00, 1.10]

[[targets.left.trajectory.segments]]
type = "line"
displacement_m = [0.40, 0.0, 0.0]
duration_s = 10.0

[[targets.left.trajectory.segments]]
type = "line"
displacement_m = [-0.40, 0.0, 0.0]
duration_s = 10.0

[simulation.initial_joint_position_rad]
# Simulation initialization is separate from generic target semantics.
left = [
  0.22356,
  0.73366,
  -0.39854,
  1.71674,
  -0.53462,
  0.91219,
  0.62194,
]

# Motion for the independent blue look_at_object mocap sphere in scene.xml.
# Required only by policy = "look_at_sim_object". The sine starts at home:
# p(t) = home + linear_amplitude_m * sin(2*pi*frequency*t), all WORLD metres.
# [simulation.look_at_object_motion]
# body_name = "look_at_object"
# home_position_world_m = [0.30, 0.00, 1.10]
# linear_amplitude_m = [0.00, 0.10, 0.00]
# linear_frequency_hz = 0.10
